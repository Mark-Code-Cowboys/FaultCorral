name: faultcorral_app
description: FaultCorral desktop UI (Phase 1 MVP).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  faultcorral_core:
    path: ../core
  faultcorral_report:
    path: ../report
  faultcorral_store:
    path: ../store
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  path_provider: ^2.1.3
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
