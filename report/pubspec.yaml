name: faultcorral_report
description: >-
  FaultCorral PDF report generation (spec §6): deterministic, hashable
  output rendered purely from a project snapshot + rollup result. Pure Dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  faultcorral_core:
    path: ../core
  pdf: ^3.11.0

dev_dependencies:
  crypto: ^3.0.7
  lints: ^4.0.0
  test: ^1.25.0
