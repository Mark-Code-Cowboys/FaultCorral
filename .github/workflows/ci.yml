name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart-packages:
    name: Core, store, report + repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Core — pub get / analyze / format / test
        working-directory: core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart format --output=none --set-exit-if-changed .
          dart test

      - name: Store — pub get / analyze / format / test
        working-directory: store
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart format --output=none --set-exit-if-changed .
          dart test

      - name: Report — pub get / analyze / format / test
        working-directory: report
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart format --output=none --set-exit-if-changed .
          dart test

      - name: Banned-vocabulary lint (spec §0.1)
        run: dart tool/banned_vocab_lint.dart

      - name: License headers
        run: dart tool/license_header_check.dart

      - name: Schema-migration check
        run: dart tool/schema_check.dart

      - name: Owner-verification checklist freshness
        run: dart tool/owner_verify_checklist.dart --check

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: App — pub get / analyze / test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: App — Linux desktop build
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
          cd app && flutter build linux --release
